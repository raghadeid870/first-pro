<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{ background-color:darkgray}
        botton{background-color:cornsilk color:gray }
    </style>
</head>
<body>
     <h1>Homework • Build a Registration Form</h1>
    
    <h2>Target Result</h2>
    
    <h3>Create your account</h3>
    
    <form>
        <label>Full name</label><br>
        <input type="text" placeholder="Enter your full name"><br><br>
        
        <label>Email</label><br>
        <input type="email" placeholder="Enter your email"><br><br>
        
        <label>Password</label><br>
        <input type="password" placeholder="Enter your password"><br><br>
        
        <label>Phone</label><br>
        <input type="tel" placeholder="Enter your phone"><br><br>
        
        <label>Birth date</label><br>
        <input type="date"><br><br>
        
        <label>Country</label><br>
        <select>
            <option>Choose a country</option>
            <option>Jordan</option>
            <option>qatar</option>
            <option>oman</option>
        </select><br><br>
        
        <label>Preferred contact</label><br>
        <input type="radio" name="contact"> Email
        <input type="radio" name="contact"> Phone<br><br>
         <input type="checkbox"> I accept the terms<br><br>
        
        <button type="submit">Create account</button>
    </form>
</body>
</html>
